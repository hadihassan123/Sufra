<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Sufra</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">Sufra <small>The Spread</small></a>
    <nav class="nav-links">
      <a href="vendor-login.html">Vendor login</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Vendor access</p>
    <h1>Reset your password</h1>
    <p class="sub">Enter the email on your vendor account and we'll send a link to set a new password.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="resetForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@business.qa">
      </div>
      <button type="submit" class="btn btn-teal btn-block" id="submitBtn">Send reset link</button>
    </form>
    <p class="auth-switch">Remembered it? <a href="vendor-login.html">Back to login</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<script type="module" src="/js/entries/vendor-forgot-password.js"></script>
</body>
</html>
