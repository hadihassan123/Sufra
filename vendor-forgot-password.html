<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Sufra</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">Sufra <small>The Spread</small></a>
    <nav class="nav-links">
      <a href="vendor-login.html">Log in</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Vendor portal</p>
    <h1>Reset password</h1>
    <p class="sub">Enter the email on your vendor account and we'll send a reset link.</p>
    <div class="form-msg" id="resetMsg"></div>
    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@business.com" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-ink btn-block">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="vendor-login.html">Back to log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<script src="js/supabase-client.js"></script>
<script src="js/escape.js"></script>
<script src="js/store.js"></script>
<script src="js/vendor.js"></script>
</body>
</html>
