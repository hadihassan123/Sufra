<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Sufra</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">Sufra <small>The Spread</small></a>
    <nav class="nav-links">
      <a href="vendor-login.html">Vendor login</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Vendor access</p>
    <h1>Set a new password</h1>
    <p class="sub" id="pageSub">Verifying your reset link…</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="resetForm" style="display:none;">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Type it again">
      </div>
      <button type="submit" class="btn btn-teal btn-block" id="submitBtn">Update password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<script type="module" src="/js/entries/vendor-reset-password.js"></script>
</body>
</html>
