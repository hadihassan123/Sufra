 <!-- The real, complete Content-Security-Policy is set as an HTTP
      response header (see render.yaml) - a <meta> tag here used to
      duplicate part of it, but only covered script-src/style-src,
      never covered default-src/font-src/img-src/connect-src/
      frame-ancestors/base-uri/form-action at all, and additionally
      claimed to allow https://unpkg.com, which the real header never
      allowed and which nothing in this codebase has ever loaded from.
      One real policy, defined once, in render.yaml. -->
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">

 <!-- JSON-LD: marketplace as WebSite + Organization (OfferCatalog for surplus food) -->
 <script type="application/ld+json">
 {
   "@context": "https://schema.org",
   "@graph": [
     {
       "@type": "WebSite",
       "@id": "https://sufra-fanr.onrender.com/#website",
       "url": "https://sufra-fanr.onrender.com/",
       "name": "Sufra",
       "description": "End-of-day surplus food marketplace in Doha. Reserve exact items, pay cash at pickup.",
       "publisher": { "@id": "https://sufra-fanr.onrender.com/#organization" },
       "inLanguage": "en"
     },
     {
       "@type": "Organization",
       "@id": "https://sufra-fanr.onrender.com/#organization",
       "name": "Sufra",
       "url": "https://sufra-fanr.onrender.com/",
       "logo": "https://sufra-fanr.onrender.com/favicon.svg",
       "areaServed": {
         "@type": "City",
         "name": "Doha",
         "containedInPlace": { "@type": "Country", "name": "Qatar" }
       }
     },
     {
       "@type": "OfferCatalog",
       "name": "Today's surplus food in Doha",
       "url": "https://sufra-fanr.onrender.com/#browse",
       "itemListElement": {
         "@type": "Offer",
         "availability": "https://schema.org/LimitedAvailability",
         "priceCurrency": "QAR",
         "description": "Discounted surplus food from verified restaurants, bakeries, and cafés. Cash at pickup."
       }
     }
   ]
 }
 </script>
