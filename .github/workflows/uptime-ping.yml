name: Uptime ping

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check live site
        run: |
          set -e
          URL="https://sufra-fanr.onrender.com"
          echo "Pinging $URL"
          curl -fsS -o /dev/null -w "%{http_code}\n" --max-time 20 "$URL"